# Default values for voting-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# Vote Web Application (Python Flask Frontend)
# -----------------------------------------------------------------------------
vote:
  replicaCount: 1
  image:
    repository: yemisi76/examplevotingapp_vote
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    targetPort: 80
    nodePort: 31000
  env:
    optionA: "Cats"
    optionB: "Dogs"
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# -----------------------------------------------------------------------------
# Result Web Application (Node.js Frontend)
# -----------------------------------------------------------------------------
result:
  replicaCount: 1
  image:
    repository: yemisi76/examplevotingapp_result
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8081
    targetPort: 80
    nodePort: 31001
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# -----------------------------------------------------------------------------
# Worker Service (.NET Background Processor)
# -----------------------------------------------------------------------------
worker:
  replicaCount: 1
  image:
    repository: yemisi76/examplevotingapp_worker
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# -----------------------------------------------------------------------------
# Redis In-Memory Queue Dependency
# -----------------------------------------------------------------------------
redis:
  enabled: true
  replicaCount: 1
  image:
    repository: redis
    tag: alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# -----------------------------------------------------------------------------
# PostgreSQL Database Dependency
# -----------------------------------------------------------------------------
db:
  enabled: true
  replicaCount: 1
  image:
    repository: postgres
    tag: 15-alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432
  # ---------------------------------------------------------------------------
  # Database Authentication & Secrets Configuration
  # ---------------------------------------------------------------------------
  # NOTE: This chart does NOT create a Kubernetes Secret containing credentials.
  # The database Secret must exist before installing or upgrading the chart.
  # For production and cluster deployments, create a Kubernetes Secret containing
  # database credentials and connection strings, and specify its name here.
  #
  # Example pre-created Secret:
  #   kubectl create secret generic voting-app-db-secret \
  #     --namespace capstone \
  #     --from-literal=postgres-user=postgres \
  #     --from-literal=postgres-password=<STRONG_PASSWORD> \
  #     --from-literal=postgres-db=postgres \
  #     --from-literal=worker-connection-string="Server=db;Username=postgres;Password=<STRONG_PASSWORD>;Database=postgres;" \
  #     --from-literal=result-database-url="postgres://postgres:<STRONG_PASSWORD>@db/postgres"
  #
  auth:
    # Name of the existing Kubernetes Secret to source database credentials from.
    # If empty, defaults to "<release-fullname>-db-secret".
    existingSecret: ""

    # Key names within the Kubernetes Secret
    secretKeys:
      usernameKey: "postgres-user"
      passwordKey: "postgres-password"
      databaseKey: "postgres-db"
      workerConnectionStringKey: "worker-connection-string"
      resultConnectionStringKey: "result-database-url"

    # Database name
    database: "postgres"

    # -------------------------------------------------------------------------
    # LOCAL-DEVELOPMENT ONLY DEFAULTS (INSECURE)
    # -------------------------------------------------------------------------
    # WARNING: Retained strictly for backward compatibility and local testing references.
    # Production credentials must be supplied via a pre-created Kubernetes Secret referenced
    # in existingSecret, and will never be rendered as literal values into manifests.
    username: "postgres"
    password: "postgres"
  resources:
    limits:
      cpu: 250m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
