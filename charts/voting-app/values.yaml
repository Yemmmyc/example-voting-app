# Default values for voting-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# Vote Web Application (Python Flask Frontend)
# -----------------------------------------------------------------------------
vote:
  replicaCount: 1
  image:
    repository: yemisi76/examplevotingapp_vote
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8080
    targetPort: 80
    nodePort: 31000
  env:
    optionA: "Cats"
    optionB: "Dogs"
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# -----------------------------------------------------------------------------
# Result Web Application (Node.js Frontend)
# -----------------------------------------------------------------------------
result:
  replicaCount: 1
  image:
    repository: yemisi76/examplevotingapp_result
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8081
    targetPort: 80
    nodePort: 31001
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# -----------------------------------------------------------------------------
# Worker Service (.NET Background Processor)
# -----------------------------------------------------------------------------
worker:
  replicaCount: 1
  image:
    repository: yemisi76/examplevotingapp_worker
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# -----------------------------------------------------------------------------
# Redis In-Memory Queue Dependency
# -----------------------------------------------------------------------------
redis:
  enabled: true
  replicaCount: 1
  image:
    repository: redis
    tag: alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# -----------------------------------------------------------------------------
# PostgreSQL Database Dependency
# -----------------------------------------------------------------------------
db:
  enabled: true
  replicaCount: 1
  image:
    repository: postgres
    tag: 15-alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432
  auth:
    username: postgres
    password: postgres
    database: postgres
  resources:
    limits:
      cpu: 250m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
