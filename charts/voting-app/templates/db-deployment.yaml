{{- if .Values.db.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    {{- include "voting-app.labels" . | nindent 4 }}
    app: db
spec:
  replicas: {{ .Values.db.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        {{- include "voting-app.labels" . | nindent 8 }}
        app: db
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          imagePullPolicy: {{ .Values.db.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.db.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.db.auth.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.db.auth.database | default "postgres" | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: db-data
          {{- with .Values.db.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: db-data
          emptyDir: {}
{{- end }}
