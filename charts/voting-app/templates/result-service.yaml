apiVersion: v1
kind: Service
metadata:
  name: result
  labels:
    {{- include "voting-app.labels" . | nindent 4 }}
    app: result
spec:
  type: {{ .Values.result.service.type | default "NodePort" }}
  ports:
    - name: result-service
      port: {{ .Values.result.service.port | default 8081 }}
      targetPort: {{ .Values.result.service.targetPort | default 80 }}
      {{- if and (eq .Values.result.service.type "NodePort") .Values.result.service.nodePort }}
      nodePort: {{ .Values.result.service.nodePort }}
      {{- end }}
  selector:
    app: result
