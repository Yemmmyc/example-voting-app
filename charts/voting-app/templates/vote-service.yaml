apiVersion: v1
kind: Service
metadata:
  name: vote
  labels:
    {{- include "voting-app.labels" . | nindent 4 }}
    app: vote
spec:
  type: {{ .Values.vote.service.type | default "NodePort" }}
  ports:
    - name: vote-service
      port: {{ .Values.vote.service.port | default 8080 }}
      targetPort: {{ .Values.vote.service.targetPort | default 80 }}
      {{- if and (eq .Values.vote.service.type "NodePort") .Values.vote.service.nodePort }}
      nodePort: {{ .Values.vote.service.nodePort }}
      {{- end }}
  selector:
    app: vote
