name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Phase 1: Test Suite
  # ---------------------------------------------------------------------------
  test:
    name: Run Application Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Execute Worker Reliability & Crash-Safety Tests
        run: |
          dotnet run --project tests/WorkerTests/WorkerTests.csproj

  # ---------------------------------------------------------------------------
  # Phase 2: Build, Trivy Security Scan, and Gated Publish
  # ---------------------------------------------------------------------------
  build-scan-publish:
    name: Build, Scan & Publish Images
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: vote
            context: ./vote
            dockerfile: ./vote/Dockerfile
            target: final
            image: examplevotingapp_vote
          - name: result
            context: ./result
            dockerfile: ./result/Dockerfile
            target: final
            image: examplevotingapp_result
          - name: worker
            context: ./worker
            dockerfile: ./worker/Dockerfile
            target: ""
            image: examplevotingapp_worker

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'yemisi76' }}/${{ matrix.service.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Step A: Build locally into Docker daemon (load: true) without pushing
      - name: Build Local Container Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          target: ${{ matrix.service.target != '' && matrix.service.target || null }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}

      # Step B: Scan the exact locally built image with Trivy
      - name: Scan Built Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME || 'yemisi76' }}/${{ matrix.service.image }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      # Step C: Publish the exact scanned local image without rebuilding
      - name: Publish Verified Image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            if [ -n "$tag" ]; then
              echo "Pushing verified image: $tag"
              docker push "$tag"
            fi
          done
